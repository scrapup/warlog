name: release-please

# Release flow (WL-56, P-05, SEC-31): release-please opens/updates the Release PR from
# Conventional Commits; merging it creates the tag and the GitHub Release. The `publish`
# job then builds and publishes the package to npm with provenance. Publishing runs in a
# separate least-privilege job (SEC-10) so a failed publish can be retried with
# "Re-run failed jobs" without re-creating the release.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # Fail fast with a clear message if the package scaffold is missing.
      - name: Check package scaffold
        run: |
          for f in package.json package-lock.json .nvmrc; do
            [ -f "$f" ] || { echo "::error::$f is missing; cannot publish"; exit 1; }
          done

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # No install-time lifecycle scripts in automation (SEC-15).
      - run: npm ci --ignore-scripts

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release summary
        if: always()
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Release"
            echo "- tag: \`$TAG\`"
            echo "- publish job status: \`$STATUS\`"
          } >> "$GITHUB_STEP_SUMMARY"
