name: ci

# Quality gates (P-03, plan §7.5). Required check names are frozen:
# `verify (ubuntu-latest)`, `verify (macos-latest)`, `verify (windows-latest)`.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # No install-time lifecycle scripts in automation (SEC-15).
      - run: npm ci --ignore-scripts
      - run: mkdir -p reports
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit -- --coverage --json --outputFile=reports/jest-unit.json
      - run: npm run build
      - run: npm run test:integration -- --json --outputFile=reports/jest-integration.json
      - run: npm run test:e2e -- --json --outputFile=reports/jest-e2e.json
      - run: npm run rules:coverage -- --allow-missing scripts/rules-pending.txt
      - run: npm run bench -- --ci

      - name: Summary
        if: always()
        run: |
          {
            echo "### verify (${{ matrix.os }})"
            if [ -f coverage/coverage-summary.json ]; then
              node -e "const t=require('./coverage/coverage-summary.json').total;for(const k of ['statements','branches','functions','lines'])console.log('- '+k+': '+t[k].pct+' %')"
            fi
            if [ -f docs/evidence/rules-coverage.md ]; then
              grep -m1 '^Proven:' docs/evidence/rules-coverage.md || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
